services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ariva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nevin}
      POSTGRES_DB: ${POSTGRES_DB:-self_correcting_rag}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ariva} -d ${POSTGRES_DB:-self_correcting_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8899:8080"  # Host port 8899 → container port 8080
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SECRET=supersecretkey123
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ariva:nevin@db:5432/self_correcting_rag
      ENVIRONMENT: development
      # SearXNG is a sibling container — use Docker service name
      SEARXNG_URL: http://searxng:8080
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_healthy
    volumes:
      - chroma_data:/app/data/chroma

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  pgdata:
  chroma_data:
