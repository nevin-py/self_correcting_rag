# Cloud Build — API image (Dockerfile lives under docker/)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - -f
      - docker/Dockerfile
      - .
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/PROJECT_ID/scrag/api:latest
options:
  logging: CLOUD_LOGGING_ONLY
