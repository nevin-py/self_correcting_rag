# Render Blueprint — deploys the SC-RAG backend as a free web service.
# In Render: New → Blueprint → pick this repo → fill the sync:false secrets.
#
# Pair with Vercel (frontend root = /frontend). See docs/DEPLOY_RENDER_VERCEL.md.
# Render free has no SearXNG: quality depends on TAVILY_API_KEY + LLM keys.
# Render blocks outbound SMTP — use Brevo (HTTP), not Gmail SMTP.
services:
  - type: web
    name: scrag-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: UVICORN_WORKERS
        value: "1"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SEARXNG_URL
        value: ""
      - key: EMAIL_BACKEND
        value: brevo
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: NOMIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM
        sync: false
